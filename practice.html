<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OCR Practice Target</title>
<style>
  body{font: 20px/1.5 system-ui,sans-serif; margin:40px; background:#f5f5f5}
  .card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:16px;margin:12px 0;max-width:600px}
  button{font-size:18px;padding:8px 14px;margin:4px;cursor:pointer}
  #output{margin-top:16px;font-weight:bold;color:#0a6}
</style></head>
<body>
  <h1>Practice Feed</h1>
  <p>Click <b>Activate Button ONE</b> to log a click.</p>

  <div class="card"><b>Job Tile Alpha</b><br>Frontend developer for a fintech startup. 5+ years React.</div>
  <div class="card"><b>Job Tile Beta</b><br>Senior Backend engineer. Python, distributed systems.</div>
  <div class="card"><b>Job Tile Gamma</b><br>Scraper engineer with strong selenium/playwright skills.</div>

  <div>
    <button>CLICK ME NOW</button>
    <button>CLICK HERE TOO</button>
  </div>

  <div id="output"></div>

  <script>
    let clicks = [];
    [...document.querySelectorAll('button')].forEach(b => b.addEventListener('click', () => {
      clicks.push(b.textContent);
      document.getElementById('output').textContent =
        'Clicked: ' + clicks.join(' , ');
    }));
  </script>
</body>
</html>
